title: Federico Pepe
description: Ableton Certified Trainer, Music Technologist, Creative Coder, Educator
url: "https://www.federicopepe.com"
baseurl: ""
author: Federico Pepe
lang: it
timezone: Europe/Rome

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-youtube
  - jekyll-sitemap

# Exclude from build output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - .bundle/
  - vendor/
  - convert_posts.rb
  - import.rb
  - federicopepe.WordPress.2026-02-28.xml
